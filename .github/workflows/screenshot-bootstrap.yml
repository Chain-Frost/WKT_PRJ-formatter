name: Render WKT README screenshot
on:
  push:
    branches: [feat/formatter-width-ci-compatibility]
    paths:
      - '.github/workflows/screenshot-bootstrap.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.repository == 'Chain-Frost/WKT_PRJ-formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formatter-width-ci-compatibility
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render original WKT before/after illustration
        run: |
          python -m pip install --quiet cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='assets/wkt-before-after.svg',write_to='assets/wkt-before-after.png')"
          file assets/wkt-before-after.png
      - name: Commit README image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wkt-before-after.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add VSIX-compatible WKT screenshot PNG (#13)"
          git fetch origin feat/formatter-width-ci-compatibility
          git rebase origin/feat/formatter-width-ci-compatibility
          git push origin HEAD:feat/formatter-width-ci-compatibility
