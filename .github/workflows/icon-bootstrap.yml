name: Create original extension icon
on:
  push:
    branches: [feat/formatter-width-ci-compatibility]
permissions:
  contents: write
jobs:
  icon:
    if: github.repository == 'Chain-Frost/WKT_PRJ-formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formatter-width-ci-compatibility
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize committed source icon
        run: |
          python -m pip install --quiet cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='assets/icon.svg',write_to='assets/icon.png',output_width=128,output_height=128)"
          file assets/icon.png
      - name: Commit 128px icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add 128px packaged extension PNG icon (#13)"
          git push origin HEAD:feat/formatter-width-ci-compatibility
