name: Capture real WKT VS Code light/dark screenshots
on:
  push:
    branches: [feat/formatter-width-ci-compatibility]
    paths: ['.github/workflows/wkt-screenshots-bootstrap.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    if: github.repository == 'Chain-Frost/WKT_PRJ-formatter'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formatter-width-ci-compatibility
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install toolchain and screenshot prerequisites
        run: |
          npm ci --no-audit --no-fund
          if ! command -v import >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
      - name: Capture actual VS Code editor, dark and light
        run: |
          mkdir -p assets/screenshots
          VSCODE_TEST_VERSIONS=stable WKT_SCREENSHOT_DIR="$PWD/assets/screenshots" xvfb-run -a -s "-screen 0 1440x900x24" npm run test:integration
          file assets/screenshots/*.png
          identify assets/screenshots/*.png
      - name: Commit screenshot evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(#12,#13): add actual dark/light VS Code WKT screenshots"
          git fetch origin feat/formatter-width-ci-compatibility
          git rebase origin/feat/formatter-width-ci-compatibility
          git push origin HEAD:feat/formatter-width-ci-compatibility
