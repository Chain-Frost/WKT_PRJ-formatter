# Temporary branch-scoped bootstrap. Remove once package-lock.json is committed.
name: Generate dependency lockfile
on:
  push:
    branches: [feat/formatter-width-ci-compatibility]

permissions:
  contents: write

jobs:
  create-lockfile:
    if: github.repository == 'Chain-Frost/WKT_PRJ-formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formatter-width-ci-compatibility
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit lockfile to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: commit deterministic npm dependency lockfile (#4)"
          git push origin HEAD:feat/formatter-width-ci-compatibility
