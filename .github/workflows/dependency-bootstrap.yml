name: Bootstrap npm lockfile
on:
  push:
    branches: [feat/formatter-width-ci-compatibility]
    paths:
      - '.github/workflows/dependency-bootstrap.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    if: github.repository == 'Chain-Frost/WKT_PRJ-formatter'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formatter-width-ci-compatibility
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update lockfile for Extension Host test dependency
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update lockfile for VS Code Extension Host tests"
          git fetch origin feat/formatter-width-ci-compatibility
          git rebase origin/feat/formatter-width-ci-compatibility
          git push origin HEAD:feat/formatter-width-ci-compatibility
