name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Build and unit tests
        run: npm test
      - name: Extension Host integration (VS Code 1.85 and stable)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:integration
          else
            npm run test:integration
          fi
      - name: Actual untrusted workspace regression (VS Code 1.85 and stable)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:untrusted
          else
            npm run test:untrusted
          fi

  package:
    name: Package validated VSIX
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Revalidate and package extension
        run: npm run package:vsix
      - name: Upload candidate VSIX (not public until both smoke tests pass)
        uses: actions/upload-artifact@v4
        with:
          name: wkt-prj-formatter-candidate
          path: '*.vsix'
          if-no-files-found: error

  packaged-smoke:
    name: Test installed VSIX
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Download exact candidate VSIX
        uses: actions/download-artifact@v4
        with:
          name: wkt-prj-formatter-candidate
      - name: Smoke-test installed VSIX (isolated profile, workspace, extensions)
        shell: bash
        run: |
          shopt -s nullglob
          vsix=(./*.vsix)
          test "${#vsix[@]}" -eq 1 || { echo "Expected one candidate VSIX"; exit 1; }
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:packaged -- "${vsix[0]}"
          else
            npm run test:packaged -- "${vsix[0]}"
          fi

  publish-artifact:
    name: Upload tested downloadable VSIX
    needs: packaged-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download validated candidate unchanged
        uses: actions/download-artifact@v4
        with:
          name: wkt-prj-formatter-candidate
      - name: Upload tested VSIX
        uses: actions/upload-artifact@v4
        with:
          name: wkt-prj-formatter-vsix
          path: '*.vsix'
          if-no-files-found: error
