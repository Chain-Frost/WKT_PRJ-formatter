name: Versioned VSIX release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require release tag commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit already merged into main."
            exit 1
          fi
      - name: Verify release tag and changelog
        shell: bash
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Regression-test release preflight without publishing
        run: node --test scripts/check-release.test.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint, compilation, unit tests
        run: npm run check
      - name: Source Extension Host integration tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:integration
          else
            npm run test:integration
          fi
      - name: Verify actual Restricted Mode (VS Code 1.85 and stable)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:untrusted
          else
            npm run test:untrusted
          fi

  package:
    name: Build validated release asset
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate package source
        run: npm run check
      - name: Build named versioned VSIX
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npx vsce package --out "wkt-prj-formatter-$version.vsix"
          test -s "wkt-prj-formatter-$version.vsix"
          unzip -l "wkt-prj-formatter-$version.vsix" | grep -F "extension/out/extension.js"
          unzip -l "wkt-prj-formatter-$version.vsix" | grep -F "extension/syntaxes/wkt.tmLanguage.json"
          unzip -l "wkt-prj-formatter-$version.vsix" | grep -F "extension/assets/icon.png"
      - name: Install-test the exact VSIX on Linux
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:packaged -- "./wkt-prj-formatter-$version.vsix"
      - name: Upload the validated VSIX unchanged
        uses: actions/upload-artifact@v4
        with:
          name: wkt-prj-formatter-release
          path: wkt-prj-formatter-*.vsix
          if-no-files-found: error
          overwrite: true

  packaged-windows:
    name: Verify installed VSIX on Windows
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: wkt-prj-formatter-release
      - name: Smoke-test same release VSIX on Windows
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run test:packaged -- "./wkt-prj-formatter-$version.vsix"

  publish:
    name: Publish matching GitHub Release
    needs: packaged-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wkt-prj-formatter-release
      - name: Publish exactly the previously tested artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          asset="wkt-prj-formatter-$version.vsix"
          test "$GITHUB_REF_NAME" = "$tag"
          test -s "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Inspect it before retrying; refusing overwrite."
            exit 1
          fi
          {
            echo "## WKT / PRJ Formatter $version"
            echo
            echo "Install the attached VSIX in VS Code using Extensions → ... → Install from VSIX."
            echo
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { printing=1; next }
              printing && /^## / { exit }
              printing { print }
            ' CHANGELOG.md
          } > release-notes.md
          gh release create "$tag" "$asset" --verify-tag --title "WKT / PRJ Formatter $version" --notes-file release-notes.md
